name: Frontend CI
run-name: Frontend CI / ${{ github.event.pull_request.number || github.ref_name }}

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      OfficialDepartmentSource: ${{ github.workspace }}/.ci/backend/src/ZonasCobertura/Data/departamentos-uruguay.geojson
    steps:
      - name: Validate PR source
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPOSITORY: ${{ github.repository }}
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          if [[ "$PR_HEAD_REPOSITORY" != "$BASE_REPOSITORY" ]]; then
            echo "Pull requests must come from a branch in this repository." >&2
            exit 1
          fi
          if [[ "$BASE_BRANCH" == main && "$PR_HEAD_REF" != develop ]]; then
            echo "Pull requests into main must come from develop." >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pin the canonical map data so a later backend push cannot change this build.
      - name: Checkout canonical department asset
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NexoRuta/NexoRuta-Backend
          ref: main
          path: .ci/backend
          sparse-checkout: src/ZonasCobertura/Data
      - name: Record canonical department asset source
        run: |
          git -C .ci/backend rev-parse HEAD
          sha256sum .ci/backend/src/ZonasCobertura/Data/departamentos-uruguay.geojson
      - name: Validate workflow syntax
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/*.yml
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restore frontend
        run: dotnet restore NexoRuta.sln --locked-mode
      - name: Build frontend
        run: dotnet build NexoRuta.sln --no-restore --configuration Release
      - name: Test portals, API client and OpenAPI contracts
        env:
          DOTNET_PROCESSOR_COUNT: "4"
        run: dotnet test NexoRuta.sln --no-build --no-restore --configuration Release --logger trx --results-directory artifacts/frontend
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: frontend-test-results-${{ github.run_id }}
          path: artifacts/**/*.trx
          if-no-files-found: error
          retention-days: 14

  result:
    name: Frontend CI / result
    if: always()
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Require the frontend validation
        env:
          RESULT: ${{ needs.build.result }}
        run: test "$RESULT" = success
