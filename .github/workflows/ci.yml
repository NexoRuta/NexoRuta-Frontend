name: Frontend CI
run-name: Frontend CI / ${{ github.event.pull_request.number || github.ref_name }}

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
      NEXORUTA_PLAYWRIGHT_MODULE: ${{ github.workspace }}/tests/browser/node_modules/playwright
      NEXORUTA_B2_BROWSER_DIR: ${{ github.workspace }}/artifacts/browser/b2
      NEXORUTA_B3_BROWSER_DIR: ${{ github.workspace }}/artifacts/browser/b3
      NEXORUTA_B4_BROWSER_DIR: ${{ github.workspace }}/artifacts/browser/b4
      NEXORUTA_B5_BROWSER_DIR: ${{ github.workspace }}/artifacts/browser/b5
      NEXORUTA_DESTINATION_BROWSER_DIR: ${{ github.workspace }}/artifacts/browser/destination
      OfficialDepartmentSource: ${{ github.workspace }}/.ci/backend/src/ZonasCobertura/Data/departamentos-uruguay.geojson
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR source
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPOSITORY: ${{ github.repository }}
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          if [[ "$BASE_BRANCH" == main ]]; then
            if [[ "$PR_HEAD_REPOSITORY" != "$BASE_REPOSITORY" ]]; then
              echo "Pull requests into main must come from this repository's develop branch." >&2
              exit 1
            fi
            if [[ "$PR_HEAD_REF" != develop ]]; then
              echo "Pull requests into main must come from develop." >&2
              exit 1
            fi
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Pin the canonical map data so a later backend push cannot change this build.
      - name: Checkout canonical department asset
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: NexoRuta/NexoRuta-Backend
          ref: 981cb4a9a26096516268f609f51e7b460c98ec1b
          path: .ci/backend
          sparse-checkout: src/ZonasCobertura/Data
      - name: Record canonical department asset source
        run: |
          git -C .ci/backend rev-parse HEAD
          sha256sum .ci/backend/src/ZonasCobertura/Data/departamentos-uruguay.geojson
      - name: Validate workflow syntax
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/*.yml
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restore frontend
        run: dotnet restore NexoRuta.sln --locked-mode
      - name: Build frontend
        run: dotnet build NexoRuta.sln --no-restore --configuration Release
      - name: Install pinned browser tools for every opt-in UI test
        run: |
          npm ci --prefix tests/browser
          tests/browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Test portals, API client and OpenAPI contracts
        env:
          DOTNET_PROCESSOR_COUNT: "4"
        run: dotnet test NexoRuta.sln --no-build --no-restore --configuration Release --logger trx --results-directory artifacts/frontend
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: frontend-test-results-${{ github.run_id }}
          path: artifacts/**/*.trx
          if-no-files-found: error
          retention-days: 14

  result:
    name: Frontend CI / result
    if: always()
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Require the frontend validation
        env:
          RESULT: ${{ needs.build.result }}
        run: test "$RESULT" = success
