name: Frontend CI
run-name: Frontend CI / ${{ github.event.pull_request.number || github.ref_name }}

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      OfficialDepartmentSource: ${{ github.workspace }}/.ci/backend/src/ZonasCobertura/Data/departamentos-uruguay.geojson
    steps:
      - name: Validate PR source
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPOSITORY: ${{ github.repository }}
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          if [[ "$BASE_BRANCH" == main ]]; then
            if [[ "$PR_HEAD_REPOSITORY" != "$BASE_REPOSITORY" ]]; then
              echo "Pull requests into main must come from this repository's develop branch." >&2
              exit 1
            fi
            if [[ "$PR_HEAD_REF" != develop ]]; then
              echo "Pull requests into main must come from develop." >&2
              exit 1
            fi
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pin the canonical map data so a later backend push cannot change this build.
      - name: Checkout canonical department asset
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NexoRuta/NexoRuta-Backend
          ref: main
          path: .ci/backend
          sparse-checkout: src/ZonasCobertura/Data
      - name: Record canonical department asset source
        run: |
          git -C .ci/backend rev-parse HEAD
          sha256sum .ci/backend/src/ZonasCobertura/Data/departamentos-uruguay.geojson
      - name: Validate workflow syntax
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/*.yml
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restore frontend
        run: dotnet restore NexoRuta.sln --locked-mode
      - name: Build frontend
        run: dotnet build NexoRuta.sln --no-restore --configuration Release
      - name: Test portals, API client and OpenAPI contracts
        env:
          DOTNET_PROCESSOR_COUNT: "4"
        run: dotnet test NexoRuta.sln --no-build --no-restore --configuration Release --logger trx --results-directory artifacts/frontend
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: frontend-test-results-${{ github.run_id }}
          path: artifacts/**/*.trx
          if-no-files-found: error
          retention-days: 14

  result:
    name: Frontend CI / result
    if: always()
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Require the frontend validation
        env:
          RESULT: ${{ needs.build.result }}
        run: test "$RESULT" = success
